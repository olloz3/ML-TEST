<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mastery: Chance to Necessity</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        mastery: {
                            dark: '#2A2A2A',
                            primary: '#8C86FF',
                            secondary: '#A3C6FF',
                            text: '#E5E7EB',
                        }
                    },
                    fontFamily: {
                        sans: ['Pretendard', 'Inter', 'sans-serif'],
                    },
                    animation: {
                        'fade-in': 'fadeIn 0.5s ease-out forwards',
                    },
                    keyframes: {
                        fadeIn: {
                            '0%': { opacity: '0', transform: 'translateY(10px)' },
                            '100%': { opacity: '1', transform: 'translateY(0)' },
                        }
                    }
                }
            }
        }
    </script>

    <!-- Fonts -->
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.8/dist/web/static/pretendard.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">

    <!-- React & ReactDOM (UMD) -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    
    <!-- Babel Standalone -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Recharts (UMD) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/recharts/2.12.3/Recharts.js"></script>

    <style>
        body {
            font-family: 'Pretendard', sans-serif;
            background-color: #2A2A2A;
            color: #E5E7EB;
        }
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: rgba(255, 255, 255, 0.05); }
        ::-webkit-scrollbar-thumb { background: rgba(140, 134, 255, 0.3); border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(163, 198, 255, 0.5); }
        .break-keep { word-break: keep-all; }
    </style>
<script type="importmap">
{
  "imports": {
    "react": "https://aistudiocdn.com/react@^19.2.1",
    "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.1/",
    "react/": "https://aistudiocdn.com/react@^19.2.1/",
    "@google/genai": "https://aistudiocdn.com/@google/genai@^1.31.0",
    "lucide-react": "https://aistudiocdn.com/lucide-react@^0.556.0",
    "recharts": "https://aistudiocdn.com/recharts@^3.5.1"
  }
}
</script>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        // ---------------------------------------------------------
        // 0. GLOBALS & UTILS
        // ---------------------------------------------------------
        const { useState, useEffect, useCallback } = React;
        const { Radar, RadarChart, PolarGrid, PolarAngleAxis, ResponsiveContainer, Tooltip: RechartsTooltip } = Recharts;

        // ---------------------------------------------------------
        // 1. CONFIGURATION & DATA
        // ---------------------------------------------------------
        const OPAL_URL = "https://opal.google/_app/?flow=drive:/15nrRcoH5HPS1-pzKp9SkcnICVAwpH4t5&shared&mode=app";

        const Category = {
            SELF_DIRECTED: "자주적 학습",
            TENACITY: "학습 집념",
            INTEGRATIVE: "통합적 학습",
            TOOLS: "도구를 통한 학습",
            NETWORK: "열린 학습 관계망"
        };

        const RAW_QUESTIONS = [
            { text: "나는 누가 가르쳐주지 않아도 내 일에 관해 더 배우려고 한다.", category: Category.SELF_DIRECTED },
            { text: "나는 내 일에 관해 새로운 것을 알아가는 것이 즐겁다.", category: Category.SELF_DIRECTED },
            { text: "나는 내 일을 더 잘하기 위해 더 배워야 할 점을 스스로 찾는다.", category: Category.SELF_DIRECTED },
            { text: "나는 상사나 선배가 지시하지 않더라도\n내 일에 관한 지식을 스스로 찾아 배운다.", category: Category.SELF_DIRECTED },
            
            { text: "나는 정한 목표가 있으면 어떻게 해서라도\n그것을 알아가며 끝까지 해낸다.", category: Category.TENACITY },
            { text: "나는 어려운 상황 속에서도 내가 하던 일은\n배워서라도 끝까지 하고야 만다.", category: Category.TENACITY },
            { text: "나는 어려운 업무가 있어도 끊임없이 노력하여 능숙히 해낸다.", category: Category.TENACITY },
            
            { text: "나는 일을 하면서 떠오른 아이디어나\n새로 알게 된 정보를 항상 메모하고 기록한다.", category: Category.INTEGRATIVE },
            { text: "나는 예전의 경험들을 다시 짚어보며 새로운 것을 배운다.", category: Category.INTEGRATIVE },
            { text: "나는 예전의 실수나 실패를 다시 돌아보며\n개선할 점을 찾아본다.", category: Category.INTEGRATIVE },
            
            { text: "나는 나의 일에 맞거나 개선시킬 수 있는\n업무도구(업무툴, 소프트웨어 등)가 있는지 자주 찾아본다.", category: Category.TOOLS },
            { text: "나는 일과 관련된 업무도구(업무툴, 소프트웨어 등)를 사용하면서\n수시로 개선점을 생각해 본다.", category: Category.TOOLS },
            { text: "나의 일에 도움이 될 것 같은 업무도구(업무툴, 소프트웨어 등)를\n발견하면 직접 사용해본다.", category: Category.TOOLS },
            { text: "나는 나의 일에 사용되는 업무도구(업무툴, 소프트웨어 등)를\n잘 활용할 수 있도록 배운다.", category: Category.TOOLS },
            
            { text: "나는 다양한 사람들과 교류함으로써\n일에 관한 통찰과 정보를 얻고자 한다.", category: Category.NETWORK },
            { text: "나는 더 좋은 결과물을 위해\n일과 관련된 다양한 이해관계자들과 소통하며 배우고자 한다.", category: Category.NETWORK },
            { text: "나는 함께 일하는 상사나 동료의\n다양한 의견을 통해 배울 점을 찾는다.", category: Category.NETWORK }
        ];

        // ---------------------------------------------------------
        // 2. SERVICES
        // ---------------------------------------------------------
        async function analyzeResults(apiKey, name, scores, strength, weakness) {
            const prompt = `
                당신은 학습 역량 진단 결과를 해석해주는 HRD 전문가입니다. 아래 데이터를 바탕으로 ${name}님을 위한 진단 결과 요약 코멘트를 2~3문장으로 작성해주세요.

                * 데이터:
                * 이름: ${name}
                * 자주적 학습: ${scores[Category.SELF_DIRECTED]}
                * 학습 집념: ${scores[Category.TENACITY]}
                * 통합적 학습: ${scores[Category.INTEGRATIVE]}
                * 도구를 통한 학습: ${scores[Category.TOOLS]}
                * 열린 학습 관계망: ${scores[Category.NETWORK]}

                * 강점 요인: ${strength}
                * 약점 요인: ${weakness}

                * 요청 사항:
                1. 전체적인 뉘앙스는 긍정적이고 격려하는 톤으로 작성할 것.
                2. 강점이 왜 좋은지, 그리고 다른 높은 점수와 어떻게 연결되는지 언급할 것.
                3. 약점은 '보완하면 좋은 점'으로 부드럽게 표현하고 간단한 실천 방안을 제안할 것.
                4. 모든 응답은 한국어로 작성할 것.
                5. 서두에 "안녕하세요, ${name}님!" 같은 인사는 생략하고 바로 본론 분석으로 들어갈 것.
                6. 텍스트 중간에 **강조**하고 싶은 단어는 반드시 **표시(별표 두개)**를 붙여서 작성할 것.
            `;

            try {
                // Using Gemini 1.5 Flash for speed and reliability
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
                });

                if (!response.ok) {
                    const errorData = await response.json();
                    throw new Error(errorData.error?.message || `HTTP Error: ${response.status}`);
                }

                const data = await response.json();
                return data.candidates?.[0]?.content?.parts?.[0]?.text || "분석 결과를 생성하지 못했습니다.";
            } catch (error) {
                console.error("Gemini API Error:", error);
                return `오류가 발생했습니다: ${error.message}. (API 키가 올바른지, 인터넷이 연결되었는지 확인해주세요)`;
            }
        }

        // ---------------------------------------------------------
        // 3. ICONS (Inline SVG Components)
        // ---------------------------------------------------------
        const IconBookOpen = () => (
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>
        );
        const IconArrowRight = () => (
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>
        );
        const IconLoader = () => (
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className="animate-spin"><path d="M21 12a9 9 0 1 1-6.219-8.56"/></svg>
        );
        const IconCheck = () => (
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><path d="m9 11 3 3L22 4"/></svg>
        );

        // ---------------------------------------------------------
        // 4. COMPONENTS
        // ---------------------------------------------------------

        const Intro = ({ onStart }) => {
            const [name, setName] = useState('');

            const handleSubmit = (e) => {
                e.preventDefault();
                // Prompt user for API key if not hardcoded (or assume user knows)
                // For this single file, we'll ask for it or use a placeholder.
                // To keep it simple based on previous requests, we'll ask for it in a prompt if needed or add an input field.
                // Re-adding the hidden API Key field logic or simplified prompt.
                // Let's stick to the name only and ask for key if needed, or add a key input field.
                // For this version, I'll add the key input field back to ensure it works.
                const apiKeyInput = document.getElementById('apikey-input');
                const key = apiKeyInput ? apiKeyInput.value : '';
                
                if (name.trim()) {
                    onStart(name.trim(), key);
                }
            };

            return (
                <div className="flex flex-col h-full justify-center animate-fade-in items-center">
                    <div className="mb-10 flex items-center justify-center gap-2 text-mastery-primary font-bold tracking-wider uppercase text-sm">
                        <IconBookOpen />
                        <span>MASTERITY LEARNING JOURNEY</span>
                    </div>
                    
                    <h1 className="text-4xl md:text-5xl font-extrabold text-white mb-10 leading-tight text-center">
                        장인적 학습 척도<br />
                        <span className="text-transparent bg-clip-text bg-gradient-to-r from-mastery-secondary to-mastery-primary">
                            역량 진단
                        </span>
                    </h1>

                    <div className="bg-white/5 border border-white/5 rounded-2xl p-6 mb-8 backdrop-blur-md w-full max-w-lg">
                        <p className="text-gray-300 leading-relaxed mb-4 break-keep whitespace-pre-line text-sm md:text-base text-left">
                            안녕하세요, 이 진단은 여러분의 현재 장인적 학습 방식을 이해하고, 
                            앞으로의 성장 방향을 설정하는 데 도움을 주기 위해 마련되었습니다.
                        </p>
                        <p className="text-gray-300 leading-relaxed mb-4 break-keep whitespace-pre-line text-sm md:text-base text-left">
                            총 17개의 문항을 읽고, '현재의 나'에게 얼마나 해당되는지 가장 가까운 점수를 선택해주세요. 
                            정답은 없으니 솔직하게 응답해주시기 바랍니다.
                        </p>
                        <p className="text-xs text-gray-500 mt-4 pt-4 border-t border-white/10 text-left">
                            * 본 설문은 장경진, 이호진, 장원섭 (2021)의 '장인적 학습 척도 개발 및 타당화 연구'를 기반으로 합니다.
                        </p>
                    </div>

                    <form onSubmit={handleSubmit} className="space-y-4 w-full max-w-md">
                        <div>
                            <label htmlFor="username" className="block text-sm font-medium text-mastery-secondary mb-2 text-center">
                                성함 (결과 리포트용)
                            </label>
                            <input
                                type="text"
                                id="username"
                                value={name}
                                onChange={(e) => setName(e.target.value)}
                                className="w-full px-4 py-3.5 bg-black/20 border border-white/10 rounded-xl text-white placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-mastery-primary transition-all text-center"
                                placeholder="이름을 입력해주세요"
                                required
                            />
                        </div>
                        
                         {/* API Key Input (Hidden by default if you want to hardcode, but visible here for usability) */}
                         <div>
                            <input
                                type="password"
                                id="apikey-input"
                                className="w-full px-4 py-2 bg-black/20 border border-white/10 rounded-xl text-white placeholder-gray-600 text-xs text-center focus:outline-none"
                                placeholder="Gemini API Key (선택사항 / 미입력시 결과만 표시)"
                            />
                        </div>

                        <button
                            type="submit"
                            disabled={!name.trim()}
                            className="w-full py-4 bg-mastery-primary hover:bg-[#7b75ff] text-white rounded-full font-bold text-lg transition-all transform hover:scale-[1.02] disabled:opacity-50 disabled:hover:scale-100 flex items-center justify-center gap-2 shadow-lg shadow-mastery-primary/20"
                        >
                            진단 시작하기 <IconArrowRight />
                        </button>
                    </form>
                </div>
            );
        };

        const Quiz = ({ question, currentStep, totalSteps, onAnswer }) => {
            const progress = ((currentStep) / totalSteps) * 100;

            return (
                <div className="flex flex-col h-full animate-fade-in relative items-center">
                    {/* Progress Bar */}
                    <div className="absolute top-0 left-0 w-full h-1.5 bg-white/10 rounded-full overflow-hidden">
                        <div 
                            className="h-full bg-gradient-to-r from-mastery-secondary to-mastery-primary transition-all duration-300 ease-out"
                            style={{ width: `${progress}%` }}
                        />
                    </div>

                    <div className="mt-8 mb-4 text-center">
                        <span className="text-mastery-primary font-bold text-sm tracking-wider uppercase">
                            Question {currentStep + 1} / {totalSteps}
                        </span>
                    </div>

                    <h2 className="text-xl md:text-2xl font-medium text-white mb-12 min-h-[120px] md:min-h-[100px] leading-snug flex items-center justify-center text-center break-keep w-full">
                        {question.text}
                    </h2>

                    <div className="w-full max-w-lg">
                        <div className="flex justify-between text-xs md:text-sm text-gray-400 mb-4 px-2">
                            <span>전혀 그렇지 않다 (1)</span>
                            <span>매우 그렇다 (7)</span>
                        </div>

                        <div className="grid grid-cols-7 gap-2 md:gap-4 mb-8">
                            {[1, 2, 3, 4, 5, 6, 7].map((score) => (
                                <button
                                    key={score}
                                    onClick={() => onAnswer(score)}
                                    className="aspect-square rounded-full border-2 border-white/10 bg-white/5 hover:bg-mastery-secondary/10 hover:border-mastery-secondary text-white font-bold text-lg md:text-xl transition-all duration-200 focus:outline-none focus:ring-2 focus:ring-mastery-primary flex items-center justify-center group"
                                >
                                    <span className="group-hover:scale-110 transition-transform">{score}</span>
                                </button>
                            ))}
                        </div>
                    </div>

                    <div className="mt-auto text-center">
                        <p className="text-xs text-gray-500">
                            맞춤형 로드맵 생성을 위해 솔직하게 응답해주시기 바랍니다.
                        </p>
                    </div>
                </div>
            );
        };

        const CustomTooltip = ({ active, payload, label }) => {
            if (active && payload && payload.length) {
                return (
                    <div className="bg-[#2A2A2A] border border-white/10 p-3 rounded-lg shadow-xl text-xs z-50">
                        <p className="text-mastery-secondary font-bold mb-1">{label}</p>
                        <p className="text-white text-lg font-bold">{payload[0].value} <span className="text-gray-400 text-xs font-normal">/ 7.0</span></p>
                    </div>
                );
            }
            return null;
        };

        const Result = ({ name, result, aiAnalysis }) => {
            const [copied, setCopied] = useState(false);

            // Transform data for Recharts
            const chartData = Object.keys(result.scores).map((key) => ({
                subject: key,
                A: result.scores[key],
                fullMark: 7,
            }));

            const handleAction = async () => {
                const copyText = `[장인성 진단 결과 - ${name}]\n\n강점: ${result.strength}\n보완: ${result.weakness}\n\n분석: ${aiAnalysis}`;
                try {
                    await navigator.clipboard.writeText(copyText);
                    setCopied(true);
                    
                    // Open link immediately in new tab
                    window.open(OPAL_URL, '_blank');
                    
                } catch (err) {
                    console.error('Failed to copy text: ', err);
                    window.open(OPAL_URL, '_blank');
                }
            };

            return (
                <div className="flex flex-col h-full animate-fade-in overflow-y-auto custom-scrollbar">
                    <h2 className="text-sm font-medium text-gray-400 mb-2 text-center tracking-widest uppercase">진단 완료!</h2>
                    <p className="text-3xl md:text-4xl font-extrabold text-white text-center mb-8 break-keep">
                        {name}님의<br/>장인적 학습 역량
                    </p>

                    {/* Chart Section */}
                    <div className="h-[280px] w-full mb-8 -ml-2">
                        <ResponsiveContainer width="100%" height="100%">
                            <RadarChart cx="50%" cy="50%" outerRadius="70%" data={chartData}>
                                <PolarGrid stroke="rgba(255,255,255,0.1)" />
                                <PolarAngleAxis 
                                    dataKey="subject" 
                                    tick={{ fill: '#A3C6FF', fontSize: 11, fontWeight: 600 }} 
                                />
                                <RechartsTooltip content={<CustomTooltip />} cursor={{ stroke: '#8C86FF', strokeWidth: 1 }} />
                                <Radar
                                    name="My Score"
                                    dataKey="A"
                                    stroke="#8C86FF"
                                    fill="#8C86FF"
                                    fillOpacity={0.4}
                                />
                            </RadarChart>
                        </ResponsiveContainer>
                    </div>

                    {/* AI Analysis Box */}
                    <div className="bg-gradient-to-br from-mastery-primary/10 to-black/30 border border-mastery-primary/30 rounded-xl p-6 mb-8 relative shadow-inner">
                        <div className="absolute -top-3 left-4 bg-mastery-primary text-xs font-bold px-3 py-1 rounded-full text-white shadow-lg flex items-center gap-1">
                            <span>✨</span> AI HRD 전문가의 분석
                        </div>
                        <div className="mt-2 text-sm md:text-base leading-relaxed text-gray-200 whitespace-pre-wrap">
                            {aiAnalysis ? aiAnalysis : <span className="animate-pulse">분석 결과를 불러오는 중입니다...</span>}
                        </div>
                    </div>

                    {/* Summary Stats */}
                    <div className="grid grid-cols-2 gap-4 mb-8">
                        <div className="bg-white/5 rounded-xl p-4 border border-white/5 hover:bg-white/10 transition-colors">
                            <div className="text-xs text-mastery-secondary font-bold uppercase mb-2 flex items-center gap-1">
                                <span>💪</span> 강점 요인
                            </div>
                            <div className="text-sm font-bold text-white line-clamp-2">{result.strength}</div>
                        </div>
                        <div className="bg-white/5 rounded-xl p-4 border border-white/5 hover:bg-white/10 transition-colors">
                            <div className="text-xs text-[#FF8C8C] font-bold uppercase mb-2 flex items-center gap-1">
                                <span>🔧</span> 보완 필요
                            </div>
                            <div className="text-sm font-bold text-white line-clamp-2">{result.weakness}</div>
                        </div>
                    </div>

                    {/* Action Button */}
                    <button
                        onClick={handleAction}
                        className={`w-full py-4 rounded-xl font-bold text-lg transition-all transform flex items-center justify-center gap-2 shadow-xl border-2 hover:scale-[1.02] active:scale-95 ${
                            copied 
                                ? "bg-green-600 border-green-500 text-white" 
                                : "bg-transparent border-mastery-secondary text-white hover:bg-mastery-secondary hover:text-black hover:border-mastery-secondary"
                        }`}
                    >
                        {copied ? (
                            <>
                                <IconCheck />
                                <span>복사 완료! Opal로 이동 중...</span>
                            </>
                        ) : (
                            <>
                                <span>💎 결과 복사 후 Opal 앱으로 이동</span>
                            </>
                        )}
                    </button>
                </div>
            );
        };

        const App = () => {
            const [screen, setScreen] = useState('INTRO');
            const [userName, setUserName] = useState('');
            const [userKey, setUserKey] = useState('');
            const [questions, setQuestions] = useState([]);
            const [currentStep, setCurrentStep] = useState(0);
            const [answers, setAnswers] = useState({});
            const [result, setResult] = useState(null);
            const [aiAnalysis, setAiAnalysis] = useState('');

            // Utility to shuffle array
            const shuffleArray = (array) => {
                const newArray = [...array];
                for (let i = newArray.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [newArray[i], newArray[j]] = [newArray[j], newArray[i]];
                }
                return newArray;
            };

            const startQuiz = (name, key) => {
                setUserName(name);
                setUserKey(key);
                // Shuffle questions and add IDs
                const shuffled = shuffleArray(RAW_QUESTIONS).map((q, idx) => ({ ...q, id: idx }));
                setQuestions(shuffled);
                setScreen('QUIZ');
            };

            const handleAnswer = (score) => {
                const currentQuestion = questions[currentStep];
                setAnswers(prev => ({ ...prev, [currentQuestion.id]: score }));
                
                if (currentStep < questions.length - 1) {
                    setCurrentStep(prev => prev + 1);
                } else {
                    // Update state immediately then finish
                    const finalAnswers = { ...answers, [currentQuestion.id]: score };
                    finishQuiz(finalAnswers);
                }
            };

            const finishQuiz = useCallback(async (finalAnswers) => {
                setScreen('LOADING');

                // 1. Calculate Scores per Category
                const categoryTotals = {};
                
                questions.forEach(q => {
                    const score = finalAnswers[q.id];
                    if (!categoryTotals[q.category]) {
                        categoryTotals[q.category] = { sum: 0, count: 0 };
                    }
                    categoryTotals[q.category].sum += score;
                    categoryTotals[q.category].count += 1;
                });

                const calculatedScores = {};
                Object.keys(categoryTotals).forEach(cat => {
                    const { sum, count } = categoryTotals[cat];
                    calculatedScores[cat] = parseFloat((sum / count).toFixed(1));
                });

                // 2. Determine Strength & Weakness
                const sorted = Object.entries(calculatedScores).sort(([, a], [, b]) => b - a);
                const maxScore = sorted[0][1];
                const minScore = sorted[sorted.length - 1][1];

                let strength = sorted.filter(([, s]) => s === maxScore).map(([c]) => c).join(', ');
                let weakness = sorted.filter(([, s]) => s === minScore).map(([c]) => c).join(', ');

                if (maxScore === minScore) {
                    strength = "모든 요인이 균형을 이룸";
                    weakness = "균형 잡힌 성장 가능";
                }

                const resultData = {
                    scores: calculatedScores,
                    strength,
                    weakness
                };
                setResult(resultData);

                // 3. Call Gemini API if key is present
                if (userKey) {
                    const analysis = await analyzeResults(userKey, userName, calculatedScores, strength, weakness);
                    setAiAnalysis(analysis);
                } else {
                    setAiAnalysis(`${userName}님, 수고하셨습니다! 강점인 [${strength}]을(를) 바탕으로 [${weakness}] 역량을 조금 더 보완한다면 멋진 장인으로 성장할 수 있습니다. (API Key가 입력되지 않아 기본 메시지가 출력되었습니다.)`);
                }
                
                setScreen('RESULT');
            }, [questions, userName, userKey]);

            return (
                <div className="min-h-screen w-full bg-mastery-dark flex items-center justify-center p-4 relative overflow-hidden font-sans text-mastery-text">
                    {/* Subtle Background Gradients */}
                    <div className="absolute top-[-10%] left-[-10%] w-[600px] h-[600px] bg-mastery-primary/10 rounded-full blur-[120px] pointer-events-none" />
                    <div className="absolute bottom-[-10%] right-[-10%] w-[600px] h-[600px] bg-mastery-secondary/10 rounded-full blur-[120px] pointer-events-none" />

                    {/* Glass Card Container */}
                    <div className="w-full max-w-2xl min-h-[650px] bg-[#2A2A2A]/80 backdrop-blur-xl border border-white/10 rounded-[30px] shadow-2xl p-6 md:p-10 relative z-10 flex flex-col">
                        {screen === 'INTRO' && <Intro onStart={startQuiz} />}
                        
                        {screen === 'QUIZ' && questions.length > 0 && (
                            <Quiz 
                                question={questions[currentStep]} 
                                currentStep={currentStep} 
                                totalSteps={questions.length} 
                                onAnswer={handleAnswer} 
                            />
                        )}

                        {screen === 'LOADING' && (
                            <div className="flex-1 flex flex-col items-center justify-center text-center animate-fade-in">
                                <IconLoader />
                                <h2 className="text-2xl font-bold text-white mb-2 mt-6">결과 분석 중...</h2>
                                <p className="text-gray-400">AI 전문가가 {userName}님의<br/>학습 성향을 심층 분석하고 있습니다.</p>
                            </div>
                        )}

                        {screen === 'RESULT' && result && (
                            <Result name={userName} result={result} aiAnalysis={aiAnalysis} />
                        )}
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
