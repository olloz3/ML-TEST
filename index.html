        // ---------------------------------------------------------
        // 2. SERVICES
        // ---------------------------------------------------------
        async function analyzeResults(apiKey, name, scores, strength, weakness) {
            const prompt = `
                당신은 학습 역량 진단 결과를 해석해주는 HRD 전문가입니다. 아래 데이터를 바탕으로 ${name}님을 위한 진단 결과 요약 코멘트를 2~3문장으로 작성해주세요.

                * 데이터:
                * 이름: ${name}
                * 자주적 학습: ${scores[Category.SELF_DIRECTED]}
                * 학습 집념: ${scores[Category.TENACITY]}
                * 통합적 학습: ${scores[Category.INTEGRATIVE]}
                * 도구를 통한 학습: ${scores[Category.TOOLS]}
                * 열린 학습 관계망: ${scores[Category.NETWORK]}

                * 강점 요인: ${strength}
                * 약점 요인: ${weakness}

                * 요청 사항:
                1. 전체적인 뉘앙스는 긍정적이고 격려하는 톤으로 작성할 것.
                2. 강점이 왜 좋은지, 그리고 다른 높은 점수와 어떻게 연결되는지 언급할 것.
                3. 약점은 '보완하면 좋은 점'으로 부드럽게 표현하고 간단한 실천 방안을 제안할 것.
                4. 모든 응답은 한국어로 작성할 것.
                5. 서두에 "안녕하세요, ${name}님!" 같은 인사는 생략하고 바로 본론 분석으로 들어갈 것.
                6. 텍스트 중간에 **강조**하고 싶은 단어는 반드시 **표시(별표 두개)**를 붙여서 작성할 것.
            `;

            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
                });

                if (!response.ok) {
                    const errorData = await response.json();
                    throw new Error(errorData.error?.message || `HTTP Error: ${response.status}`);
                }

                const data = await response.json();
                return data.candidates?.[0]?.content?.parts?.[0]?.text || "분석 결과를 생성하지 못했습니다.";
            } catch (error) {
                console.error("Gemini API Error:", error);
                return `오류가 발생했습니다: ${error.message}. (API 키가 올바른지, 인터넷이 연결되었는지 확인해주세요)`;
            }
        }
